name: build-kaggle-yt-dlp-vendor-artifact

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install -e ".[media]"
          python -m pip show yt-dlp

      - name: Build yt-dlp vendor artifact
        run: |
          python - <<'PY'
          import zipfile
          from importlib import util
          from pathlib import Path

          out = Path("workdir/kaggle-vendor")
          out.mkdir(parents=True, exist_ok=True)
          readme = out / "README.txt"
          readme.write_text(
              "Upload yt_dlp_vendor.zip to a public Kaggle dataset. "
              "Set KAGGLE_VENDOR_DATASET_REF to owner/dataset-slug.\n",
              encoding="utf-8",
          )

          spec = util.find_spec("yt_dlp")
          if not spec or not spec.submodule_search_locations:
              raise SystemExit("yt_dlp is not installed")
          source_dir = Path(next(iter(spec.submodule_search_locations)))
          with zipfile.ZipFile(out / "yt_dlp_vendor.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(source_dir.rglob("*")):
                  if not path.is_file() or path.suffix == ".pyc" or "__pycache__" in path.parts:
                      continue
                  archive.write(path, Path("yt_dlp") / path.relative_to(source_dir))
          print(f"Built {out / 'yt_dlp_vendor.zip'}")
          PY

      - name: Upload yt-dlp vendor artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-yt-dlp-vendor
          path: |
            workdir/kaggle-vendor/yt_dlp_vendor.zip
            workdir/kaggle-vendor/README.txt
          retention-days: 14
