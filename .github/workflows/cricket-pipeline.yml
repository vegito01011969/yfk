name: scheduled-cricket-shorts-pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2,14 * * *"

concurrency:
  group: cricket-youtube-shorts-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write

    env:
      CI: "true"
      CONTENT_DOMAIN: cricket
      CONTENT_LABEL: Cricket Moments
      SOURCE_LANGUAGE_MODE: cycle
      SOURCE_LANGUAGES: en
      SOURCE_HISTORY_PATH: data/cricket_source_video_history.json
      USE_REAL_MEDIA: "true"
      DOWNLOAD_BACKEND: colab
      MAX_DOWNLOAD_VIDEOS: "5"
      MAX_DOWNLOAD_ATTEMPTS: "30"
      MIN_DOWNLOAD_VIDEOS_FOR_UPLOAD: "2"
      FAIL_ON_NO_SOURCE_DOWNLOADS: "false"
      ENABLE_YOUTUBE_UPLOAD: "true"
      YOUTUBE_UPLOAD_PRIVACY_STATUS: "public"
      YOUTUBE_UPLOAD_NOTIFY_SUBSCRIBERS: "false"
      YOUTUBE_UPLOAD_CATEGORY_ID: "22"
      YOUTUBE_UPLOAD_EXPECTED_CHANNEL_ID: ${{ secrets.CRICKET_YOUTUBE_CHANNEL_ID }}
      YOUTUBE_VIDEO_MADE_FOR_KIDS: "false"
      YOUTUBE_VIDEO_SELF_DECLARED_MADE_FOR_KIDS: "false"
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GROQCLOUD_API_KEY: ${{ secrets.GROQCLOUD_API_KEY }}
      YOUTUBE_OAUTH_CLIENT_SECRETS: secrets/youtube_client_secret.json
      YOUTUBE_OAUTH_TOKEN_PATH: secrets/youtube_oauth_token.json
      YT_DLP_COOKIES_PATH: secrets/youtube_cookies.txt
      YT_DLP_JS_RUNTIMES: node
      YT_DLP_VERBOSE: "true"
      COLAB_CLI_AUTH: adc
      GOOGLE_APPLICATION_CREDENTIALS: secrets/colab_adc.json
      COLAB_UPLOAD_YOUTUBE_COOKIES: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js for yt-dlp JavaScript challenges
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ffmpeg on Linux runners
        if: runner.os == 'Linux'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Check ffmpeg on non-Linux runners
        if: runner.os != 'Linux'
        run: |
          command -v ffmpeg
          command -v ffprobe

      - name: Install Python dependencies
        run: |
          python -m pip install -e ".[media,ai]"
          python -m pip install "google-colab-cli"
          python -m pip install "jupyter-kernel-client @ git+https://github.com/googlecolab/jupyter-kernel-client.git@f18e982c3265df5e923aa9def101ab3fd737e139"
          python -m pip show yt-dlp google-colab-cli
          colab version

      - name: Prepare runtime directories
        run: mkdir -p data workdir/runs secrets

      - name: Restore cricket pipeline state
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: data/cricket_source_video_history.json
          key: cricket-pipeline-state-v1-${{ github.run_id }}
          restore-keys: |
            cricket-pipeline-state-v1-

      - name: Materialize cricket YouTube auth files
        env:
          YOUTUBE_OAUTH_CLIENT_SECRETS_JSON: ${{ secrets.CRICKET_YOUTUBE_OAUTH_CLIENT_SECRETS_JSON }}
          YOUTUBE_OAUTH_TOKEN_JSON: ${{ secrets.CRICKET_YOUTUBE_OAUTH_TOKEN_JSON }}
          YOUTUBE_COOKIES_TXT: ${{ secrets.YOUTUBE_COOKIES_TXT }}
          COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          secrets_dir = Path("secrets")
          secrets_dir.mkdir(parents=True, exist_ok=True)

          required = {
              "YOUTUBE_OAUTH_CLIENT_SECRETS_JSON": secrets_dir / "youtube_client_secret.json",
              "YOUTUBE_OAUTH_TOKEN_JSON": secrets_dir / "youtube_oauth_token.json",
              "YOUTUBE_COOKIES_TXT": secrets_dir / "youtube_cookies.txt",
          }
          missing = [name for name in required if not os.environ.get(name)]
          if not os.environ.get("YOUTUBE_UPLOAD_EXPECTED_CHANNEL_ID"):
              missing.append("CRICKET_YOUTUBE_CHANNEL_ID")
          if (
              os.environ.get("DOWNLOAD_BACKEND") == "colab"
              and os.environ.get("COLAB_CLI_AUTH") == "adc"
              and not os.environ.get("COLAB_ADC_JSON")
          ):
              missing.append("COLAB_ADC_JSON")
          if missing:
              raise SystemExit(f"Missing required GitHub secrets: {', '.join(missing)}")

          for env_name, path in required.items():
              path.write_text(os.environ[env_name], encoding="utf-8")

          colab_adc = os.environ.get("COLAB_ADC_JSON")
          if colab_adc:
              (secrets_dir / "colab_adc.json").write_text(colab_adc, encoding="utf-8")
          else:
              print("COLAB_ADC_JSON is not set; Colab CLI auth must be provided another way")
          PY

      - name: Validate YouTube cookies file
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("secrets/youtube_cookies.txt")
          text = path.read_text(encoding="utf-8")
          lines = [line for line in text.splitlines() if line.strip()]
          if not lines:
              raise SystemExit("YOUTUBE_COOKIES_TXT produced an empty cookies file")
          if not lines[0].startswith(("# Netscape HTTP Cookie File", "# HTTP Cookie File")):
              raise SystemExit(
                  "YOUTUBE_COOKIES_TXT must be raw Netscape cookies.txt content, not base64 or JSON"
              )
          youtube_lines = [
              line for line in lines
              if not line.startswith("#") and ("youtube.com" in line or "google.com" in line)
          ]
          if not youtube_lines:
              raise SystemExit("YOUTUBE_COOKIES_TXT has no youtube.com/google.com cookie rows")
          print(f"Validated YouTube cookies file: {len(lines)} lines, {len(youtube_lines)} relevant rows")
          PY

      - name: Validate Colab CLI access
        if: env.DOWNLOAD_BACKEND == 'colab'
        run: colab --auth="$COLAB_CLI_AUTH" sessions

      - name: Run cricket pipeline
        run: viral-pipeline run --no-resume

      - name: Summarize cricket pipeline run
        if: always()
        env:
          PIPELINE_SUMMARY_LABEL: Cricket Shorts Pipeline
        run: python scripts/summarize_pipeline_run.py

      - name: Upload cricket pipeline diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cricket-pipeline-diagnostics-${{ github.run_id }}
          path: |
            data/cricket_source_video_history.json
            workdir/runs/**/context.json
            workdir/runs/**/publish/publish_manifest.json
            workdir/runs/**/upload/youtube_upload.json
            workdir/runs/**/render/*.debug.json
          retention-days: 3

      - name: Cleanup bulky cricket pipeline state
        if: always()
        run: viral-pipeline cleanup --yes

      - name: Save updated cricket pipeline state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cricket_source_video_history.json
          key: cricket-pipeline-state-v1-${{ github.run_id }}
