name: scheduled-youtube-shorts-pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

concurrency:
  group: youtube-shorts-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write

    env:
      CI: "true"
      USE_REAL_MEDIA: "true"
      ENABLE_YOUTUBE_UPLOAD: "true"
      YOUTUBE_UPLOAD_PRIVACY_STATUS: "public"
      YOUTUBE_UPLOAD_NOTIFY_SUBSCRIBERS: "false"
      YOUTUBE_UPLOAD_CATEGORY_ID: "22"
      YOUTUBE_VIDEO_MADE_FOR_KIDS: "false"
      YOUTUBE_VIDEO_SELF_DECLARED_MADE_FOR_KIDS: "false"
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GROQCLOUD_API_KEY: ${{ secrets.GROQCLOUD_API_KEY }}
      YOUTUBE_OAUTH_CLIENT_SECRETS: secrets/youtube_client_secret.json
      YOUTUBE_OAUTH_TOKEN_PATH: secrets/youtube_oauth_token.json
      YT_DLP_COOKIES_PATH: secrets/youtube_cookies.txt
      YT_DLP_JS_RUNTIMES: node

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js for yt-dlp JavaScript challenges
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: python -m pip install -e ".[media,ai]"

      - name: Prepare runtime directories
        run: mkdir -p data workdir/runs secrets

      - name: Restore pipeline state
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: data/source_video_history.json
          key: pipeline-state-${{ github.run_id }}
          restore-keys: |
            pipeline-state-

      - name: Materialize YouTube auth files
        env:
          YOUTUBE_OAUTH_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRETS_JSON }}
          YOUTUBE_OAUTH_TOKEN_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON }}
          YOUTUBE_COOKIES_TXT: ${{ secrets.YOUTUBE_COOKIES_TXT }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          secrets_dir = Path("secrets")
          secrets_dir.mkdir(parents=True, exist_ok=True)

          required = {
              "YOUTUBE_OAUTH_CLIENT_SECRETS_JSON": secrets_dir / "youtube_client_secret.json",
              "YOUTUBE_OAUTH_TOKEN_JSON": secrets_dir / "youtube_oauth_token.json",
              "YOUTUBE_COOKIES_TXT": secrets_dir / "youtube_cookies.txt",
          }
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(f"Missing required GitHub secrets: {', '.join(missing)}")

          for env_name, path in required.items():
              path.write_text(os.environ[env_name], encoding="utf-8")
          PY

      - name: Run full pipeline
        run: viral-pipeline run --no-resume

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-failure-${{ github.run_id }}
          path: |
            data/source_video_history.json
            workdir/runs/**/context.json
            workdir/runs/**/publish/publish_manifest.json
            workdir/runs/**/upload/youtube_upload.json
            workdir/runs/**/render/*.debug.json
          retention-days: 3

      - name: Cleanup bulky pipeline state
        if: always()
        run: viral-pipeline cleanup --yes

      - name: Save updated pipeline state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/source_video_history.json
          key: pipeline-state-${{ github.run_id }}
