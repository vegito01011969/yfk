name: experimental-kaggle-shorts-pipeline

on:
  workflow_dispatch:
    inputs:
      content_domain:
        description: "Pipeline domain to test through Kaggle"
        required: true
        default: "kids_funny"
        type: choice
        options:
          - kids_funny
          - football
          - cricket

concurrency:
  group: kaggle-shorts-pipeline-experiment
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    env:
      CI: "true"
      CONTENT_DOMAIN: ${{ inputs.content_domain }}
      SOURCE_HISTORY_PATH: data/source_video_history-kaggle-experiment.json
      USE_REAL_MEDIA: "true"
      DOWNLOAD_BACKEND: kaggle
      MAX_DOWNLOAD_VIDEOS: "5"
      MAX_DOWNLOAD_ATTEMPTS: "12"
      MAX_DOWNLOAD_STAGE_SECONDS: "900"
      MIN_DOWNLOAD_VIDEOS_FOR_UPLOAD: "2"
      FAIL_ON_NO_SOURCE_DOWNLOADS: "false"
      ENABLE_YOUTUBE_UPLOAD: "false"
      RENDER_COMMAND_TIMEOUT_SECONDS: "300"
      PROVENANCE_TRANSFORM_TIMEOUT_SECONDS: "300"
      PROVENANCE_TRANSFORM_FAIL_OPEN: "true"
      PROVENANCE_TRANSFORM_LEVEL: "2"
      YOUTUBE_VIDEO_MADE_FOR_KIDS: "false"
      YOUTUBE_VIDEO_SELF_DECLARED_MADE_FOR_KIDS: "false"
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GROQCLOUD_API_KEY: ${{ secrets.GROQCLOUD_API_KEY }}
      YT_DLP_COOKIES_PATH: secrets/youtube_cookies.txt
      YT_DLP_JS_RUNTIMES: node
      YT_DLP_EXTRACTOR_ARGS: "youtube:player_client=tv_downgraded,tv_simply,web_embedded,android_vr,mweb,web_safari"
      YT_DLP_VERBOSE: "false"
      YT_DLP_DOWNLOAD_TIMEOUT_SECONDS: "90"
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KERNEL_SLUG: viral-pipeline-ytdlp-${{ github.run_id }}
      KAGGLE_KERNEL_TITLE: Viral Pipeline yt-dlp Experiment ${{ github.run_id }}
      KAGGLE_COMMAND_TIMEOUT_SECONDS: "1800"
      KAGGLE_VENDOR_DATASET_REF: ${{ secrets.KAGGLE_VENDOR_DATASET_REF }}
      KAGGLE_UPLOAD_YOUTUBE_COOKIES: "true"
      KAGGLE_ENABLE_BROWSER_PO_TOKEN: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js for yt-dlp JavaScript challenges
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up static ffmpeg
        timeout-minutes: 8
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            python -m pip install "static-ffmpeg==2.13"
            python scripts/setup_static_ffmpeg.py | tee /tmp/static_ffmpeg_setup.log
            FFMPEG_BIN_DIR="$(grep '^bin_dir=' /tmp/static_ffmpeg_setup.log | cut -d= -f2-)"
            export PATH="$FFMPEG_BIN_DIR:$PATH"
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1

      - name: Install Python dependencies
        run: |
          python -m pip install -e ".[media,ai]"
          python -m pip install "kaggle"
          python -m pip show yt-dlp kaggle
          kaggle --version

      - name: Prepare runtime directories
        run: mkdir -p data workdir/runs secrets

      - name: Configure Kaggle auth
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          kaggle_dir = Path.home() / ".kaggle"
          kaggle_dir.mkdir(parents=True, exist_ok=True)
          kaggle_dir.chmod(0o700)

          api_token = os.environ.get("KAGGLE_API_TOKEN", "").strip()
          username = os.environ.get("KAGGLE_USERNAME", "").strip()
          key = os.environ.get("KAGGLE_KEY", "").strip()

          if api_token:
              token_path = kaggle_dir / "access_token"
              token_path.write_text(api_token, encoding="utf-8")
              token_path.chmod(0o600)
              print("Configured Kaggle auth with KAGGLE_API_TOKEN")

          def extract_legacy_credentials(raw: str) -> tuple[str, str] | None:
              if not raw.lstrip().startswith("{"):
                  return None
              try:
                  payload = json.loads(raw)
              except json.JSONDecodeError:
                  return None
              parsed_username = str(payload.get("username") or "").strip()
              parsed_key = str(payload.get("key") or "").strip()
              if parsed_username and parsed_key:
                  return parsed_username, parsed_key
              return None

          for raw_value in (key, api_token):
              parsed = extract_legacy_credentials(raw_value)
              if parsed:
                  username, key = parsed
                  break

          if not api_token and username and key:
              legacy_path = kaggle_dir / "kaggle.json"
              legacy_path.write_text(
                  json.dumps({"username": username, "key": key}),
                  encoding="utf-8",
              )
              legacy_path.chmod(0o600)
              print("Configured Kaggle auth with legacy username/key")

          if not api_token and not (username and key):
              raise SystemExit(
                  "Missing Kaggle auth. Set KAGGLE_API_TOKEN, or both "
                  "KAGGLE_USERNAME and KAGGLE_KEY."
              )
          PY

      - name: Materialize YouTube cookies
        env:
          YOUTUBE_COOKIES_TXT: ${{ secrets.YOUTUBE_COOKIES_TXT }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          cookies = os.environ.get("YOUTUBE_COOKIES_TXT")
          if not cookies:
              raise SystemExit("Missing required GitHub secret: YOUTUBE_COOKIES_TXT")
          secrets_dir = Path("secrets")
          secrets_dir.mkdir(parents=True, exist_ok=True)
          (secrets_dir / "youtube_cookies.txt").write_text(cookies, encoding="utf-8")
          PY

      - name: Validate YouTube cookies file
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("secrets/youtube_cookies.txt")
          text = path.read_text(encoding="utf-8")
          lines = [line for line in text.splitlines() if line.strip()]
          if not lines:
              raise SystemExit("YOUTUBE_COOKIES_TXT produced an empty cookies file")
          if not lines[0].startswith(("# Netscape HTTP Cookie File", "# HTTP Cookie File")):
              raise SystemExit(
                  "YOUTUBE_COOKIES_TXT must be raw Netscape cookies.txt content, not base64 or JSON"
              )
          youtube_lines = [
              line for line in lines
              if not line.startswith("#") and ("youtube.com" in line or "google.com" in line)
          ]
          if not youtube_lines:
              raise SystemExit("YOUTUBE_COOKIES_TXT has no youtube.com/google.com cookie rows")
          print(f"Validated YouTube cookies file: {len(lines)} lines, {len(youtube_lines)} relevant rows")
          PY

      - name: Validate Kaggle credentials
        run: |
          kaggle config view
          kaggle kernels list --mine --page-size 1

      - name: Configure Kaggle vendor dataset
        run: |
          if [ -z "$KAGGLE_VENDOR_DATASET_REF" ]; then
            echo "Missing required secret: KAGGLE_VENDOR_DATASET_REF"
            echo "Create a public Kaggle dataset containing yt_dlp_vendor.zip, then set this secret to owner/dataset-slug."
            exit 1
          fi
          VENDOR_REF="$(python - <<'PY'
          import os
          import re

          raw = os.environ["KAGGLE_VENDOR_DATASET_REF"].strip().lower().rstrip("/")
          raw = re.sub(r"^https?://(?:www\.)?kaggle\.com/datasets/", "", raw)
          raw = re.sub(r"[?#].*$", "", raw)
          parts = [part for part in raw.split("/") if part]
          normalized = "/".join(parts[:2]) if len(parts) >= 2 else raw
          if not re.fullmatch(r"[a-z0-9_-]+/[a-z0-9][a-z0-9_-]{2,49}", normalized):
              raise SystemExit(
                  "KAGGLE_VENDOR_DATASET_REF must be owner/dataset-slug "
                  "or https://www.kaggle.com/datasets/owner/dataset-slug"
              )
          print(normalized)
          PY
          )"
          echo "KAGGLE_VENDOR_DATASET_REF=${VENDOR_REF}" >> "$GITHUB_ENV"
          echo "Using Kaggle vendor dataset: ${VENDOR_REF}"

      - name: Run Kaggle download experiment pipeline
        run: viral-pipeline run --no-resume

      - name: Validate final render exists
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          context_paths = sorted(
              Path("workdir/runs").glob("*/context.json"),
              key=lambda path: path.stat().st_mtime,
              reverse=True,
          )
          if not context_paths:
              raise SystemExit("No pipeline context was created")
          context = json.loads(context_paths[0].read_text(encoding="utf-8"))
          selected_clips = context.get("selected_clips") or []
          if len(selected_clips) < 2:
              raise SystemExit(f"Kaggle experiment selected only {len(selected_clips)} clip(s)")
          render = context.get("render") or {}
          render_path = Path(render.get("path") or "")
          if not render_path.exists() or render_path.stat().st_size <= 0:
              raise SystemExit(f"Final render is missing or empty: {render_path}")
          download_summary = context.get("metadata", {}).get("download_summary") or {}
          if download_summary.get("backend") != "kaggle":
              raise SystemExit(f"Unexpected download backend: {download_summary.get('backend')}")
          print(f"Validated Kaggle render: {render_path} ({render_path.stat().st_size} bytes)")
          PY

      - name: Summarize Kaggle experiment
        if: always()
        env:
          PIPELINE_SUMMARY_LABEL: Kaggle Shorts Pipeline Experiment
        run: python scripts/summarize_pipeline_run.py

      - name: Collect Kaggle kernel diagnostics
        if: always()
        run: |
          mkdir -p workdir/kaggle-diagnostics
          KERNEL_REF="${KAGGLE_USERNAME}/${KAGGLE_KERNEL_SLUG}"
          {
            echo "kernel_ref=${KERNEL_REF}"
            echo "vendor_ref=${KAGGLE_VENDOR_DATASET_REF}"
            echo "kaggle_version=$(kaggle --version 2>&1)"
          } > workdir/kaggle-diagnostics/summary.txt
          kaggle kernels status "$KERNEL_REF" \
            > workdir/kaggle-diagnostics/status.txt 2>&1 || true
          kaggle kernels files "$KERNEL_REF" \
            > workdir/kaggle-diagnostics/files.txt 2>&1 || true
          kaggle kernels logs "$KERNEL_REF" \
            > workdir/kaggle-diagnostics/logs.txt 2>&1 || true

      - name: Upload Kaggle experiment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-pipeline-experiment-${{ github.run_id }}
          path: |
            data/source_video_history-kaggle-experiment.json
            workdir/runs/**/context.json
            workdir/runs/**/publish/publish_manifest.json
            workdir/runs/**/render/*.mp4
            workdir/runs/**/render/*.debug.json
            workdir/runs/**/downloads/kaggle_kernel/kernel-metadata.json
            workdir/runs/**/downloads/kaggle_output/**
            workdir/runs/**/downloads/result.json
            workdir/kaggle-diagnostics/**
          retention-days: 3

      - name: Cleanup bulky pipeline state
        if: always()
        run: python scripts/cleanup_pipeline_state.py
