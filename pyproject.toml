[project]
name = "viral-trend-pipeline"
version = "0.1.0"
description = "Automated pipeline for discovering viral trends and producing narrated YouTube compilation videos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "rich>=13.7",
  "requests>=2.32",
  "openai>=1.40",
  "google-api-python-client>=2.150",
  "google-auth>=2.35",
  "google-auth-oauthlib>=1.2",
  "google-auth-httplib2>=0.2",
]

[project.optional-dependencies]
media = [
  "yt-dlp>=2024.8.6",
]
ai = []
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
viral-pipeline = "viral_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viral_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
